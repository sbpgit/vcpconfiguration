      - dist/ 
  
  - name: vcpappvcpcolorcodeuploadapp
    type: html5
    path: app/VCP_COLORCODEUPLOADAPP
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
