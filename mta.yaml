_schema-version: 3.3.0
ID: vcpconfiguration
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
 
  - name: vcpconfiguration-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: vcpconfiguration-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: resources/
      requires:    
      - artifacts:
        - cdm.json
        name: vcpconfiguration-workzone-cdm
        target-path: resources/    
      - artifacts:
        - vcpappvcpdynamicfrozenfirm.zip
        name: vcpappvcpdynamicfrozenfirm
        target-path: resources/
      - artifacts:
        - vcpappvcpcolorcodeuploadapp.zip
        name: vcpappvcpcolorcodeuploadapp
        target-path: resources/
      - artifacts:
        - vcpappvcpversionscenariomaintenance.zip
        name: vcpappvcpversionscenariomaintenance
        target-path: resources/
      - artifacts:
        - vcpappvcpkeyfiguremaintenance.zip
        name: vcpappvcpkeyfiguremaintenance
        target-path: resources/
      - artifacts:
        - vcpappvcpperiodprofilemaintenance.zip
        name: vcpappvcpperiodprofilemaintenance
        target-path: resources/
      - artifacts:
        - vcpappvcpplanningapps1.zip
        name: vcpappvcpplanningapps1
        target-path: resources/

      - artifacts:
        - vcpappvcppredictionprofilemaintenance.zip
        name: vcpappvcppredictionprofilemaintenance
        target-path: resources/

      - artifacts:
        - vcpappvcpprofileconfiguration.zip
        name: vcpappvcpprofileconfiguration
        target-path: resources/

      - artifacts:
        - demovcpcharconfig.zip
        name: demovcpcharconfig
        target-path: resources/
        
      - artifacts:
        - vcpibpapis.zip
        name: vcpibpapis
        target-path: resources/

  - name: vcpibpapis
    type: html5
    path: app/VCP_INTERFAXE_MAPPING_APP
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpprofileconfiguration
    type: html5
    path: app/VCP_Profile_Configuration
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
