    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpversionscenariomaintenance
    type: html5
    path: app/VCP_VERSION_SCENARIO
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpkeyfiguremaintenance
    type: html5
    path: app/VCP_KEY_FIGURE
    build-parameters:
      build-result: dist
      builder: custom
