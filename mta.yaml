  - name: vcpconfiguration-destinations
    type: com.sap.application.content
    requires:
      - name: vcpconfiguration-html5-repo-host
        parameters:
          service-key:
            name: vcpconfiguration-repo-host-key
      - name: vcpconfiguration-html5-runtime
        parameters:
          service-key:
            name: vcpconfiguration-html5-app-runtime-service-key
      - name: vcpconfiguration-destination
        parameters:
          content-target: true
    parameters:
      content:
        subaccount:
          destinations:
            - Name: vcpconfiguration_cdm
              ServiceInstanceName: vcpconfiguration-html5-runtime
              ServiceKeyName: vcpconfiguration-html5-app-runtime-service-key
              URL: https://html5-apps-repo-rt.cfapps.us10.hana.ondemand.com/applications/cdm/vcpconfiguration
              sap.cloud.service: vcpconfiguration
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  - name: vcpconfiguration-workzone-cdm
    type: html5
    path: workzone
    build-parameters:
      build-result: .
      supported-platforms: []
            

resources:
  - name: vcpconfiguration-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        ExposeToSubaccounts: true
        HTML5Runtime_enabled: true
        init_data:
          subaccount:
            destinations:
            - Authentication: NoAuthentication
              Name: ui5
              ProxyType: Internet
              Type: HTTP
              URL: https://ui5.sap.com
            - Authentication: NoAuthentication
              CEP.HTML5contentprovider: true
              Name: vcpconfiguration-workzone-runtime
              ProxyType: Internet
              Type: HTTP
              URL: https://sbp-mttdev.launchpad.cfapps.us10.hana.ondemand.com
            existing_destinations_policy: update

  - name: vcpconfiguration-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: vcpconfiguration-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
       


