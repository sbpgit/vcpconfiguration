      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []
      ignore:
      - node_modules/ 
      - dist/ 

  - name: vcpappvcpplanningapps1
    type: html5
    path: app/VCP_Planning_Application
    build-parameters:
      build-result: dist
      builder: custom
      commands:
      - npm install
      - npm run build:cf
      - rm -rf node_modules
      supported-platforms: []  
      ignore:
